# The whole shop server: app + Postgres + Caddy (automatic HTTPS) + nightly backups.
#   docker compose up -d --build      start / update
#   docker compose logs -f app        see what the app is doing
# Settings live in .env (made by deploy/server-setup.sh). See DEPLOY.md.
name: shopos

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shopos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: shopos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopos -d shopos"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://shopos:${POSTGRES_PASSWORD}@db:5432/shopos
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set in .env}
      APP_HOST: ${APP_HOST:?set in .env}
      SETUP_CODE: ${SETUP_CODE:-}
      RAILS_LOG_LEVEL: ${RAILS_LOG_LEVEL:-info}
      BACKUP_DIR: /backups
    volumes:
      - ./backups:/backups:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/up"]
      interval: 30s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      APP_HOST: ${APP_HOST}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGUSER: shopos
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: shopos
      BACKUP_AT: ${BACKUP_AT:-23:30}
      KEEP_DAYS: ${KEEP_DAYS:-30}
      TZ: Asia/Kolkata
    volumes:
      - ./backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh", "loop"]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
