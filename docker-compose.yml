# The whole shop server: app + Caddy (automatic HTTPS) + backups. Fits a 1 GB server.
#   docker compose pull && docker compose up -d     start / update (deploy/update.sh does this)
#   docker compose logs -f app                      see what the app is doing
# Settings live in .env (made by deploy/server-setup.sh). See DEPLOY.md.
name: shopos

services:
  app:
    # Built by GitHub Actions on every push to main (.github/workflows/image.yml).
    # `docker compose build` builds it on the server instead, if ever needed.
    image: ghcr.io/tenet07/hisaab:${APP_TAG:-main}
    build: .
    restart: unless-stopped
    environment:
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set in .env}
      APP_HOST: ${APP_HOST:?set in .env}
      SETUP_CODE: ${SETUP_CODE:-}
      RAILS_LOG_LEVEL: ${RAILS_LOG_LEVEL:-info}
      BACKUP_DIR: /backups
    volumes:
      - storage:/rails/storage          # the shop database lives here
      - ./backups:/backups:ro           # nightly copies, for Settings -> Backups
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/up"]
      interval: 30s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      APP_HOST: ${APP_HOST}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Nightly copy into ./backups (kept 30 days).
  backup:
    build: ./deploy/backup
    user: "1000:1000"                   # same user as the app, so database files keep one owner
    restart: unless-stopped
    depends_on: [app]
    environment:
      BACKUP_AT: ${BACKUP_AT:-23:30}
      KEEP_DAYS: ${KEEP_DAYS:-30}
    volumes:
      - storage:/rails/storage
      - ./backups:/backups

  # Every change copied to Cloudflare R2 within a second. Turned on by COMPOSE_PROFILES=r2
  # in .env once the R2 keys are filled in (DEPLOY.md step 3).
  litestream:
    image: litestream/litestream:0.3.13
    profiles: [r2]
    user: "1000:1000"
    restart: unless-stopped
    depends_on: [app]
    command: replicate
    environment:
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PATH: ${R2_PATH:-shop}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
    volumes:
      - storage:/rails/storage
      - ./deploy/litestream.yml:/etc/litestream.yml:ro

volumes:
  storage:
  caddy_data:
  caddy_config:
