# One small server (e.g. 2 vCPU / 4 GB in Mumbai): web + background jobs + Postgres.
# docker compose up -d   — then point a domain at it behind Caddy/nginx for HTTPS.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: hisaab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
  web:
    build: .
    restart: unless-stopped
    depends_on: [db]
    env_file: .env
    environment: &env
      DATABASE_URL: postgres://hisaab:${POSTGRES_PASSWORD}@db/hisaab_production
    ports: ["3000:3000"]
    volumes: [storage:/rails/storage]
  jobs:
    build: .
    restart: unless-stopped
    depends_on: [db, web]
    env_file: .env
    environment: *env
    command: ./bin/jobs
    volumes: [storage:/rails/storage]
volumes:
  pgdata:
  storage:
