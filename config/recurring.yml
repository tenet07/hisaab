production: &schedule
  overdue_reminders:
    class: OverdueRemindersJob
    schedule: "0 10 * * * Asia/Kolkata"
  monthly_statements:
    class: MonthlyStatementsJob
    schedule: "0 8 1 * * Asia/Kolkata"
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

development:
  <<: *schedule
