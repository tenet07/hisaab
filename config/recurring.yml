production: &schedule
  overdue_reminders:
    class: OverdueRemindersJob
    schedule: every day at 10am Asia/Kolkata
  monthly_statements:
    class: MonthlyStatementsJob
    schedule: at 8am on the first day of the month Asia/Kolkata
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

development:
  <<: *schedule
