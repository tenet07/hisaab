<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>No internet</title>
<style>
  :root{color-scheme:light dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px/1.5 system-ui,sans-serif;background:#eef0eb;color:#14201a}
  @media (prefers-color-scheme:dark){body{background:#0c1511;color:#e6ece8}}
  main{max-width:340px;padding:24px;text-align:center}
  img{width:64px;height:64px;border-radius:16px}
  h1{font-size:22px;margin:16px 0 8px}
  button{margin-top:16px;min-height:48px;padding:0 24px;border:0;border-radius:12px;background:#0f5132;color:#fff;font:600 16px system-ui}
</style></head>
<body><main>
  <img src="/icon-192.png" alt="">
  <h1>No internet</h1>
  <p>Nothing was lost. Anything you saved is on the server. Connect to mobile data or Wi-Fi and try again.</p>
  <button onclick="location.reload()">Try again</button>
</main></body></html>
