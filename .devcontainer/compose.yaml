name: hisaab
services:
  rails-app:
    image: ghcr.io/rails/devcontainer/images/ruby:3.3.6
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    depends_on: [postgres]
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
volumes:
  postgres-data:
